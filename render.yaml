services:
  - type: web
    name: fitzone-api
    runtime: node
    rootDir: backend
    plan: free
    # Install build tools even with NODE_ENV=production; remove them after compilation.
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build && npm prune --omit=dev
    startCommand: npm run start:prod
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
